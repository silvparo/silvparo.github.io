
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f4f0">
<title>InstaPeople.app</title>
<link rel="manifest" href="manifest.webmanifest">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
}

:root {
  --bg: #f3f3f1;
  --ink: #111;
  --muted: #777;
  --line: #e5e3dc;
  --yes: #19a566;
  --no: #ef4444;
}

html {
  width: 100%;
  min-height: 100%;
}

body {
  width: 100%;
  min-height: 100vh;
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: Inter, ui-sans-serif, -apple-system,
    BlinkMacSystemFont, "Segoe UI", sans-serif;
  overflow-x: hidden;
  overflow-y: auto;
}

button,
input,
select {
  font: inherit;
}

button {
  cursor: pointer;
}

/* HEADER */

header {
  width: min(100%, 800px);
  margin: 0 auto;
  padding: 12px 10px;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 8px;
}

.brand {
  width: 100%;
  margin: 0;
  text-align: center;
  font-size: 24px;
  line-height: 34px;
  font-weight: 900;
  letter-spacing: normal;
}

.header-actions {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.gender-select-wrap {
  position: relative;
}

.gender-select-btn {
  min-width: 126px;
  min-height: 36px;
  padding: 0 13px 0 15px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: white;
  color: #171717;
  font-size: 13px;
  font-weight: 800;
}

.chevron {
  width: 18px;
  height: 18px;
  display: grid;
  place-items: center;
  color: #777;
}

.chevron svg {
  width: 16px;
  height: 16px;
}

.gender-select-wrap.open .chevron svg {
  transform: rotate(180deg);
}

.gender-menu {
  position: absolute;
  top: calc(100% + 8px);
  right: 0;
  width: 172px;
  padding: 6px;
  background: white;
  border: 1px solid var(--line);
  border-radius: 17px;
  box-shadow: 0 18px 50px #0000001b;
  visibility: hidden;
  opacity: 0;
  z-index: 80;
}

.gender-select-wrap.open .gender-menu {
  visibility: visible;
  opacity: 1;
}

.gender-option {
  width: 100%;
  padding: 10px 11px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border: 0;
  border-radius: 12px;
  background: transparent;
  text-align: left;
  font-size: 13px;
  font-weight: 750;
  color: #555;
}

.gender-option:hover {
  background: #f5f4f0;
}

.gender-option .check {
  opacity: 0;
}

.gender-option.active {
  background: #111;
  color: white;
}

.gender-option.active .check {
  opacity: 1;
}

.pill {
  min-height: 36px;
  padding: 0 14px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: white;
  font-size: 13px;
  font-weight: 750;
  white-space: nowrap;
}

.pill.dark {
  background: #111;
  border-color: #111;
  color: white;
}

.home-btn {
  width: 40px;
  height: 36px;
  flex-shrink: 0;
  display: grid;
  place-items: center;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: white;
  color: #111;
}

.home-icon,
.home-icon svg {
  width: 20px;
  height: 20px;
  display: block;
}

/* NORMAL PAGE LAYOUT */

main {
  width: min(100%, 800px);
  margin: 0 auto;
  padding: 10px 10px 24px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* SINGLE PROFILE CARD */

.deck {
  position: relative;
  width: 100%;
  aspect-ratio: 4 / 5;
  min-height: 260px;
  max-height: 65vh;
  border-radius: 22px;
}

.empty {
  display: none;
  width: 100%;
  min-height: 260px;
  padding: 30px;
  border: 1px dashed #c9c7c0;
  border-radius: 28px;
  place-items: center;
  text-align: center;
  color: #777;
}

.card {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  border-radius: 22px;
  background: #ddd;
  user-select: none;
}

.card img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
  pointer-events: none;
}

/* MATCHING TOP CORNER BADGES */

.profile-views,
.report-btn {
  position: absolute;
  top: 12px;
  z-index: 10;

  height: 29px;
  padding: 7px 10px;

  display: flex;
  align-items: center;
  justify-content: center;

  border: 0;
  border-radius: 999px;

  background: rgba(0, 0, 0, .58);
  color: white;

  font-size: 12px;
  font-weight: 800;
  line-height: 1;

  backdrop-filter: blur(8px);
}

.profile-views {
  left: 12px;
  pointer-events: none;
}

.report-btn {
  right: 12px;
  min-width: 29px;
  cursor: pointer;
}

.report-btn:hover {
  background: #ef4444;
}

.report-btn:disabled {
  opacity: .5;
  cursor: wait;
}

/* ACTION BUTTONS */

.actions {
  width: 100%;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 10px;
}

.action {
  width: 100%;
  min-height: 70px;
  padding: 18px 10px;
  border: 0;
  border-radius: 18px;
  color: white;
  font-size: clamp(15px, 2.2vw, 20px);
  font-weight: 850;
}

.action#no {
  background: var(--no);
}

.action#yes {
  background: var(--yes);
}

.action:hover {
  filter: brightness(.96);
}

.action:disabled {
  opacity: .5;
  cursor: wait;
}

/* MODALS */

.overlay {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: none;
  place-items: center;
  padding: 18px;
  background: #0007;
  backdrop-filter: blur(8px);
  overflow-y: auto;
}

.overlay.show {
  display: grid;
}

.sheet {
  width: min(100%, 800px);
  max-height: min(85dvh, 650px);
  padding: 25px;
  overflow-y: auto;
  overscroll-behavior: contain;
  background: white;
  border-radius: 27px;
  box-shadow: 0 30px 100px #0004;
}

.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 18px;
}

.top h2 {
  margin: 0;
  font-size: 23px;
  letter-spacing: normal;
}

.close {
  width: 35px;
  height: 35px;
  flex-shrink: 0;
  border: 0;
  border-radius: 50%;
  background: #f2f1ed;
  font-size: 18px;
}

.field {
  margin: 13px 0;
}

.field label {
  display: block;
  margin-bottom: 6px;
  font-size: 12px;
  font-weight: 800;
}

.field input,
.field select {
  width: 100%;
  padding: 13px;
  border: 1px solid #ddd;
  border-radius: 13px;
  outline: none;
}

.submit {
  display: block;
  width: 100%;
  padding: 14px;
  border: 0;
  border-radius: 14px;
  background: #111;
  color: white;
  text-align: center;
  text-decoration: none;
  font-weight: 850;
}

.msg {
  min-height: 18px;
  margin-top: 10px;
  color: #777;
  text-align: center;
  font-size: 12px;
}

.ghost {
  width: 100%;
  padding: 13px;
  border: 0;
  background: transparent;
  color: #777;
  font-weight: 700;
}

.install-now {
  display: none;
  margin-bottom: 8px;
}

.steps {
  margin: 16px 0;
  padding: 15px 17px;
  border-radius: 17px;
  background: #f6f5f1;
  text-align: left;
}

.install-section {
  padding: 12px 0;
  border-top: 1px solid var(--line);
}

.install-section:first-child {
  border-top: 0;
}

.install-section h3 {
  margin: 0 0 8px;
  font-size: 16px;
}

.install-section p {
  margin: 6px 0;
  color: #555;
  font-size: 14px;
  line-height: 1.45;
}

.instagram-input {
  width: 100%;
  display: flex;
  align-items: center;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: white;
  overflow: hidden;
}

.instagram-prefix {
  flex-shrink: 0;
  padding-left: 13px;
  color: #777;
  font-size: 14px;
  font-weight: 650;
}

.instagram-input input {
  flex: 1;
  min-width: 0;
  border: 0;
  padding-left: 2px;
}

/* MOBILE */

@media (max-width: 650px) {
  header {
    padding: 10px;
    gap: 5px;
  }

  .brand {
    font-size: 22px;
    line-height: 32px;
  }

  .header-actions {
    display: grid;
    grid-template-columns:
      minmax(0, 1fr)
      minmax(0, 1fr)
      34px;
    gap: 6px;
  }

  .gender-select-wrap,
  .gender-select-btn,
  #addPersonBtn {
    width: 100%;
    min-width: 0;
  }

  .gender-select-btn,
  #addPersonBtn,
  .home-btn {
    height: 34px;
    min-height: 34px;
  }

  .gender-select-btn {
    padding: 0 10px 0 12px;
    gap: 8px;
    font-size: 12px;
  }

  .gender-menu {
    left: 0;
    right: auto;
  }

  .home-btn {
    width: 34px;
  }

  main {
    padding: 10px 10px 24px;
  }

  .deck {
    aspect-ratio: 4 / 5;
    max-height: 65vh;
  }

  .action {
    min-height: 64px;
  }

  .sheet {
    padding: 20px;
  }
}

@media (max-width: 360px) {
  .pill {
    padding: 0 8px;
    font-size: 11px;
  }

  .gender-select-btn {
    font-size: 11px;
  }
}
</style>
</head>

<body>

<header>
  <div class="brand">InstaPeople.app</div>

  <div class="header-actions">
    <div class="gender-select-wrap">
      <button
        class="gender-select-btn"
        id="genderSelectBtn"
        type="button"
        aria-expanded="false"
      >
        <span id="genderSelectLabel">Everyone</span>

        <span class="chevron" aria-hidden="true">
          <svg viewBox="0 0 20 20" fill="none">
            <path
              d="M5.5 7.5L10 12L14.5 7.5"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </span>
      </button>

      <div class="gender-menu" id="genderMenu">
        <button
          class="gender-option active"
          data-gender="all"
          type="button"
        >
          <span>Everyone</span>
          <span class="check">✓</span>
        </button>

        <button
          class="gender-option"
          data-gender="female"
          type="button"
        >
          <span>Women</span>
          <span class="check">✓</span>
        </button>

        <button
          class="gender-option"
          data-gender="male"
          type="button"
        >
          <span>Men</span>
          <span class="check">✓</span>
        </button>
      </div>
    </div>

    <button
      class="pill dark"
      id="addPersonBtn"
      type="button"
    >
      Register person
    </button>

    <button
      class="home-btn"
      id="installHelp"
      type="button"
      title="Save to Home Screen"
      aria-label="Save to Home Screen"
    >
      <span class="home-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <path
            d="M12 15V3M12 3L8 7M12 3L16 7"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            d="M7 11H5.75C4.78 11 4 11.78 4 12.75V18.25C4 19.22 4.78 20 5.75 20H18.25C19.22 20 20 19.22 20 18.25V12.75C20 11.78 19.22 11 18.25V12.75C20 11.78 19.22 11 18.25 11H17"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </span>
    </button>
  </div>
</header>

<main>
  <div class="deck" id="deck"></div>

  <div class="empty" id="empty">
    <div>
      <b>No one in this filter category exists</b>
    </div>
  </div>

  <div class="actions" id="actions">
    <button class="action" id="no" type="button">
      Next
    </button>

    <button class="action" id="yes" type="button">
      View Profile
    </button>
  </div>
</main>

<!-- REGISTER PERSON -->

<div class="overlay" id="addPerson">
  <div class="sheet">
    <div class="top">
      <h2>Register person</h2>

      <button
        class="close"
        data-close="addPerson"
        type="button"
        aria-label="Close"
      >
        ×
      </button>
    </div>

    <form id="personForm">
      <div class="field">
        <label for="insta">Instagram profile</label>

        <div class="instagram-input">
          <span class="instagram-prefix">
            instagram.com/
          </span>

          <input
            id="insta"
            required
            placeholder="username"
            autocomplete="off"
          >
        </div>
      </div>

      <div class="field">
        <label for="gender">Gender</label>

        <select id="gender" required>
          <option value="">Select gender</option>
          <option value="female">Woman</option>
          <option value="male">Man</option>
          <option value="other">Other</option>
        </select>
      </div>

      <div class="field">
        <label for="photo">Profile image</label>

        <input
          id="photo"
          type="file"
          accept="image/*"

      </div>

      <div
        id="photoPreviewWrap"
        style="display:none;margin:14px 0;text-align:center"
      >
        <img
          id="photoPreview"
          alt="Preview"
          style="width:112px;height:112px;object-fit:cover;border-radius:22px"
        >
      </div>

      <button
        class="submit"
        id="personSubmit"
        type="submit"
      >
        Register person
      </button>

      <div class="msg" id="msg"></div>
    </form>
  </div>
</div>

<!-- INSTALL HELP -->

<div class="overlay" id="install">
  <div class="sheet">
    <div class="top">
      <h2>Save InstaPeople.app to your Home Screen</h2>

      <button
        class="close"
        data-close="install"
        type="button"
        aria-label="Close"
      >
        ×
      </button>
    </div>

    <p style="color:#777;font-size:13px;line-height:1.5">
      Use InstaPeople.app like an app with its own
      icon and full-screen window.
    </p>

    <button
      class="submit install-now"
      id="installNow"
      type="button"
    >
      Install app
    </button>

    <div class="steps" id="installSteps"></div>

    <button
      class="ghost"
      data-close="install"
      type="button"
    >
      Got it
    </button>
  </div>
</div>

<script>
/* SUPABASE */

const SUPABASE_URL =
  "https://yffpgvegymvynqjiwybl.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_WyWbRhZFQtzjFvmtOkH8cg_DNPKD0oM";

const connected =
  !SUPABASE_URL.startsWith("YOUR_") &&
  !SUPABASE_PUBLISHABLE_KEY.startsWith("YOUR_");

const sb = connected
  ? window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY,
      {
        auth: {
          persistSession: false,
          autoRefreshToken: false,
          detectSessionInUrl: false
        }
      }
    )
  : null;

/* DEMO PROFILES */

const demo = [
  {
    id: "1",
    name: "Mia",
    gender: "female",
    instagram_username: "instagram",
    image_url:
      "https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=1000&q=85",
    reported: false
  },
  {
    id: "2",
    name: "Noah",
    gender: "male",
    instagram_username: "instagram",
    image_url:
      "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=1000&q=85",
    reported: false
  },
  {
    id: "3",
    name: "Sofia",
    gender: "female",
    instagram_username: "instagram",
    image_url:
      "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=1000&q=85",
    reported: false
  },
  {
    id: "4",
    name: "Leo",
    gender: "male",
    instagram_username: "instagram",
    image_url:
      "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=1000&q=85",
    reported: false
  }
];

/* STATE */

let profiles = [];
let shown = [];
let idx = 0;
let filter = "all";
let deferredPrompt = null;
let reporting = false;

const $ = selector =>
  document.querySelector(selector);

const deck = $("#deck");
const empty = $("#empty");

/* HELPERS */

function esc(value = "") {
  return String(value).replace(
    /[&<>"']/g,
    char => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    }[char])
  );
}

function randomIndex(length) {
  return Math.floor(Math.random() * length);
}

/* LOAD DATABASE PROFILES */

async function load() {
  if (!connected) {
    profiles = [...demo];
    apply();
    return;
  }

  try {
    const {
      data: { user }
    } = await sb.auth.getUser();

    let query = sb
      .from("profiles")
      .select("*")
      .eq("reported", false)
      .order("created_at", {
        ascending: false
      });

    if (user) {
      query = query.neq("id", user.id);
    }

    const { data, error } = await query;

    if (error) {
      throw error;
    }

    profiles = data || [];
    apply();

  } catch (error) {
    console.error(
      "Could not load profiles:",
      error
    );

    profiles = [];
    apply();

    empty.innerHTML = `
      <div>
        Could not load profiles.
        Please refresh the page.
      </div>
    `;
  }
}

/* FILTER PROFILES */

function apply() {
  shown = (
    filter === "all"
      ? [...profiles]
      : profiles.filter(
          profile => profile.gender === filter
        )
  ).filter(
    profile => !profile.reported
  );

  idx = shown.length
    ? randomIndex(shown.length)
    : 0;

  render();
}

/* PROFILE VIEW COUNTER */

function getProfileViews(profile) {
  if (
    profile.profile_views !== null &&
    profile.profile_views !== undefined &&
    Number.isFinite(
      Number(profile.profile_views)
    )
  ) {
    return Number(profile.profile_views);
  }

  const key =
    "instapeople_views_" +
    String(
      profile.id ||
      profile.instagram_username ||
      "profile"
    );

  let stored = localStorage.getItem(key);

  if (stored === null) {
    const seed = String(
      profile.id ||
      profile.instagram_username ||
      "profile"
    )
      .split("")
      .reduce(
        (sum, char) =>
          sum + char.charCodeAt(0),
        0
      );

    stored = String(
      40 + (seed % 1960)
    );

    localStorage.setItem(
      key,
      stored
    );
  }

  return Number(stored);
}

/* CREATE ONE PROFILE CARD */

function card(profile) {
  const element =
    document.createElement("div");

  element.className = "card";

  element.innerHTML = `
    <img
      src="${esc(profile.image_url)}"
      alt="${esc(
        profile.name ||
        profile.instagram_username ||
        "Profile"
      )}"
    >

    <div class="profile-views">
      Profile views:
      ${getProfileViews(profile).toLocaleString()}
    </div>

    <button
      class="report-btn"
      type="button"
      aria-label="Report profile"
      title="Report profile"
    >!</button>
  `;

  const reportButton =
    element.querySelector(".report-btn");

  reportButton.addEventListener(
    "click",
    event => {
      event.stopPropagation();

      reportProfile(
        profile,
        reportButton
      );
    }
  );

  return element;
}

/* DISPLAY ONLY ONE CARD */

function render() {
  deck.innerHTML = "";

  if (
    !shown.length ||
    idx >= shown.length
  ) {
    deck.style.display = "none";
    empty.style.display = "grid";

    $("#actions").style.display = "none";

    return;
  }

  deck.style.display = "block";
  empty.style.display = "none";

  $("#actions").style.display = "grid";

  const currentProfile = shown[idx];

  deck.append(
    card(currentProfile)
  );
}

/* NEXT BUTTON: RANDOM DIFFERENT PROFILE */

function nextProfile() {
  if (
    reporting ||
    shown.length <= 1
  ) {
    return;
  }

  const currentId =
    shown[idx].id;

  const alternatives =
    shown.filter(
      profile =>
        profile.id !== currentId
    );

  if (!alternatives.length) {
    return;
  }

  const randomProfile =
    alternatives[
      randomIndex(
        alternatives.length
      )
    ];

  idx = shown.findIndex(
    profile =>
      profile.id === randomProfile.id
  );

  render();
}

/* REPORT PROFILE */

async function reportProfile(
  profile,
  button
) {
  if (reporting) {
    return;
  }

  const confirmed =
    window.confirm(
      "Report this profile?"
    );

  if (!confirmed) {
    return;
  }

  reporting = true;
  button.disabled = true;

  $("#no").disabled = true;
  $("#yes").disabled = true;

  try {
    if (connected) {
      const {
        data,
        error
      } = await sb
        .from("profiles")
        .update({
          reported: true
        })
        .eq(
          "id",
          profile.id
        )
        .eq(
          "reported",
          false
        )
        .select("id");

      if (error) {
        throw error;
      }

      if (
        !data ||
        data.length !== 1
      ) {
        throw new Error(
          "The report could not be saved. Check database permissions."
        );
      }
    }

    profile.reported = true;

    profiles = profiles.filter(
      p => p.id !== profile.id
    );

    shown = shown.filter(
      p => p.id !== profile.id
    );

    idx = shown.length
      ? randomIndex(
          shown.length
        )
      : 0;

    render();

  } catch (error) {
    console.error(
      "Report failed:",
      error
    );

    alert(
      "Could not report this profile. Please try again."
    );

    button.disabled = false;

  } finally {
    reporting = false;

    $("#no").disabled = false;
    $("#yes").disabled = false;
  }
}

/* GENDER FILTER */

$("#genderSelectBtn").onclick =
  event => {
    event.stopPropagation();

    const wrapper =
      $(".gender-select-wrap");

    wrapper.classList.toggle(
      "open"
    );

    $("#genderSelectBtn")
      .setAttribute(
        "aria-expanded",
        wrapper.classList.contains(
          "open"
        )
      );
  };

$("#genderMenu").onclick =
  event => {
    const option =
      event.target.closest(
        ".gender-option"
      );

    if (!option) {
      return;
    }

    filter =
      option.dataset.gender;

    $("#genderSelectLabel")
      .textContent =
        option.querySelector(
          "span"
        ).textContent;

    document
      .querySelectorAll(
        ".gender-option"
      )
      .forEach(
        button =>
          button.classList.remove(
            "active"
          )
      );

    option.classList.add(
      "active"
    );

    $(".gender-select-wrap")
      .classList.remove(
        "open"
      );

    $("#genderSelectBtn")
      .setAttribute(
        "aria-expanded",
        "false"
      );

    apply();
  };

document.addEventListener(
  "click",
  event => {
    if (
      !event.target.closest(
        ".gender-select-wrap"
      )
    ) {
      $(".gender-select-wrap")
        .classList.remove(
          "open"
        );

      $("#genderSelectBtn")
        .setAttribute(
          "aria-expanded",
          "false"
        );
    }
  }
);

/* NEXT BUTTON */

$("#no").onclick = () => {
  nextProfile();
};

/* VIEW PROFILE BUTTON */

$("#yes").onclick = () => {
  if (reporting) {
    return;
  }

  const profile =
    shown[idx];

  if (!profile) {
    return;
  }

  const username =
    (
      profile.instagram_username ||
      ""
    )
      .replace("@", "")
      .trim();

  if (username) {
    window.open(
      "https://www.instagram.com/" +
        encodeURIComponent(username) +
        "/",
      "_blank",
      "noopener,noreferrer"
    );
  }

  if (
    connected &&
    profile.id
  ) {
    sb.rpc(
      "increment_profile_view",
      {
        profile_id:
          profile.id
      }
    ).then(
      ({ error }) => {
        if (error) {
          console.warn(
            "Could not count profile view:",
            error.message
          );
        }
      }
    );
  }

  nextProfile();
};

/* MODAL CONTROLS */

document
  .querySelectorAll(
    "[data-close]"
  )
  .forEach(
    button => {
      button.onclick = () => {
        $(
          "#" +
          button.dataset.close
        ).classList.remove(
          "show"
        );
      };
    }
  );

$("#addPersonBtn").onclick =
  () => {
    $("#msg").textContent = "";

    $("#addPerson")
      .classList.add(
        "show"
      );
  };

/* IMAGE PREVIEW */

$("#photo").onchange =
  event => {
    const file =
      event.target.files[0];

    if (!file) {
      $("#photoPreviewWrap")
        .style.display =
          "none";

      return;
    }

    $("#photoPreview").src =
      URL.createObjectURL(
        file
      );

    $("#photoPreviewWrap")
      .style.display =
        "block";
  };

/* REGISTER PERSON */

$("#personForm").onsubmit =
  async event => {
    event.preventDefault();

    let instagram =
      $("#insta")
        .value
        .trim();

    instagram = instagram
      .replace(
        /^https?:\/\/(www\.)?instagram\.com\//i,
        ""
      )
      .replace(
        /^www\.instagram\.com\//i,
        ""
      )
      .replace(
        /^instagram\.com\//i,
        ""
      )
      .replace(
        /^@/,
        ""
      )
      .split(
        /[/?#]/
      )[0]
      .trim();

    const gender =
      $("#gender").value;

    const file =
      $("#photo")
        .files[0];

    if (
      !instagram ||
      !gender ||
      !file
    ) {
      $("#msg")
        .textContent =
          "Complete every field.";

      return;
    }

    const button =
      $("#personSubmit");

    button.disabled = true;
    button.style.opacity = ".6";

    $("#msg").textContent =
      connected
        ? "Uploading profile..."
        : "Registering demo profile...";

    try {
      let image_url;

      if (connected) {
        const ext =
          (
            file.name
              .split(".")
              .pop() ||
            "jpg"
          ).toLowerCase();

        const safeUser =
          instagram.replace(
            /[^a-zA-Z0-9._-]/g,
            "_"
          );

        const path =
          "public/" +
          safeUser +
          "-" +
          Date.now() +
          "." +
          ext;

        const upload =
          await sb.storage
            .from(
              "profile-images"
            )
            .upload(
              path,
              file,
              {
                cacheControl:
                  "3600",
                upsert:
                  false
              }
            );

        if (
          upload.error
        ) {
          throw upload.error;
        }

        image_url =
          sb.storage
            .from(
              "profile-images"
            )
            .getPublicUrl(
              path
            )
            .data
            .publicUrl;

        const inserted =
          await sb
            .from(
              "profiles"
            )
            .insert({
              instagram_username:
                instagram,
              gender,
              image_url,
              reported:
                false
            })
            .select()
            .single();

        if (
          inserted.error
        ) {
          throw inserted.error;
        }

        profiles.unshift({
          ...inserted.data,
          name:
            "@" +
            inserted.data
              .instagram_username
        });

      } else {
        image_url =
          URL.createObjectURL(
            file
          );

        profiles.unshift({
          id:
            "local-" +
            Date.now(),
          name:
            "@" +
            instagram,
          instagram_username:
            instagram,
          gender,
          image_url,
          reported:
            false
        });
      }

      $("#msg")
        .textContent =
          "Person registered ✓";

      $("#personForm")
        .reset();

      $("#photoPreviewWrap")
        .style.display =
          "none";

      apply();

      setTimeout(
        () => {
          $("#addPerson")
            .classList.remove(
              "show"
            );
        },
        550
      );

    } catch (error) {
      console.error(
        error
      );

      $("#msg")
        .textContent =
          error.message ||
          "Could not register person.";

    } finally {
      button.disabled = false;
      button.style.opacity = "1";
    }
  };

/* INSTALL INSTRUCTIONS */

function installGuide() {
  $("#install")
    .classList.add(
      "show"
    );

  $("#installNow")
    .style.display =
      deferredPrompt
        ? "block"
        : "none";

  $("#installSteps")
    .innerHTML = `
      <div class="install-section">
        <h3>iOS</h3>
        <p>1. Open InstaPeople.app in Safari.</p>
        <p>2. Tap the Share button.</p>
        <p>3. Tap <b>Add to Home Screen</b>.</p>
        <p>4. Tap <b>Add</b>.</p>
      </div>

      <div class="install-section">
        <h3>Android</h3>
        <p>1. Open InstaPeople.app in Chrome.</p>
        <p>2. Tap the ⋮ menu.</p>
        <p>3. Tap <b>Add to Home screen</b> or
           <b>Install app</b>.</p>
        <p>4. Confirm installation.</p>
      </div>
    `;
}

$("#installHelp").onclick =
  installGuide;

window.addEventListener(
  "beforeinstallprompt",
  event => {
    event.preventDefault();

    deferredPrompt =
      event;
  }
);

$("#installNow").onclick =
  async () => {
    if (
      !deferredPrompt
    ) {
      return;
    }

    deferredPrompt.prompt();

    await deferredPrompt
      .userChoice;

    deferredPrompt = null;

    $("#install")
      .classList.remove(
        "show"
      );
  };

/* ESC CLOSES MODALS; NO SWIPE CONTROLS */

document.addEventListener(
  "keydown",
  event => {
    if (
      event.key ===
      "Escape"
    ) {
      document
        .querySelectorAll(
          ".overlay.show"
        )
        .forEach(
          modal =>
            modal.classList.remove(
              "show"
            )
        );

      $(".gender-select-wrap")
        .classList.remove(
          "open"
        );
    }
  }
);

/* INITIALIZE */

load();
</script>
